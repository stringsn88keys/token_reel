name: Release

# Publishes to RubyGems whenever a "v*" tag is pushed, and is also
# called directly as a reusable workflow by version-bump.yml right
# after it creates that tag. (A tag pushed by the default GITHUB_TOKEN
# does NOT trigger other workflows, so the push-tags trigger alone
# never fires for tags version-bump.yml creates -- the workflow_call
# path is what actually runs the release in that case.) Uses
# RubyGems' Trusted Publishing (OIDC) -- no API key stored in this repo.
# One-time setup required on rubygems.org: Settings > Trusted Publishers
# on the token_reel gem, with owner "stringsn88keys", repository
# "token_reel", workflow filename "release.yml", environment "release".

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: "Tag/ref to check out and release. Defaults to the triggering ref."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to check out and release (e.g. v0.3.0). Defaults to the ref this is run against."
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run specs
        run: bundle exec rake spec

      - name: Build gem
        run: gem build token_reel.gemspec

  release:
    name: Publish to RubyGems
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby

      - uses: rubygems/release-gem@v1
